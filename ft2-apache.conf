# Apache config snippet for a SECOND ft WASM instance, served at /ft2/.
# Mirrors ft-apache.conf but maps /ft2 -> /srv/ft2 so it runs side-by-side
# with the /ft instance without disturbing it or the main site.
#
# This is NOT a full vhost — it's meant to be Include'd inside the existing
# :443 SSL vhost on lbem-status.epfl.ch (the same one that Includes
# ft-wasm.conf). The site's DocumentRoot stays at /var/www/html.
#
# Install:
#     sudo cp ft2-apache.conf /etc/apache2/conf-available/ft2-wasm.conf
#     sudo a2enmod headers deflate          # already on if /ft is set up
# Then in /etc/apache2/sites-available/default-ssl.conf, inside the
# <VirtualHost _default_:443> block, add (next to the existing ft Include):
#     Include conf-available/ft2-wasm.conf
# Then: sudo apache2ctl configtest && sudo systemctl reload apache2

Alias /ft2 /srv/ft2

<Directory /srv/ft2>
    Require all granted
    Options -Indexes
    AllowOverride None
    # Serve /ft2/ directly as ft.html so the URL is just /ft2/.
    DirectoryIndex ft.html

    # Cross-origin isolation — REQUIRED for the multithreaded WASM build.
    # Without these the browser does not expose SharedArrayBuffer, so pthreads
    # (and the parallel FFT) are unavailable. Scoped to this <Directory> so the
    # rest of the site (the PHP app) is unaffected — a site-wide COEP
    # require-corp would otherwise block its cross-origin resources.
    <IfModule mod_headers.c>
        Header set Cross-Origin-Opener-Policy "same-origin"
        Header set Cross-Origin-Embedder-Policy "require-corp"
    </IfModule>
</Directory>

# The directives below are server-global and identical to ft-apache.conf's.
# They are harmless no-ops if ft-wasm.conf is also loaded (Apache merges them),
# and keep this snippet self-contained if /ft2 is ever deployed on its own.

# Correct MIME type for WebAssembly.
AddType application/wasm .wasm

# Gzip wasm/js/html/svg payloads.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/wasm application/javascript text/html image/svg+xml
</IfModule>

# ft.wasm / ft.js are overwritten in place on each deploy (no content hash
# in the filename), so they MUST revalidate.
<IfModule mod_headers.c>
    <FilesMatch "\.(wasm|js|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.svg$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
