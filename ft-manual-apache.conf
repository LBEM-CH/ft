# Apache config snippet for the ft manual pages, served as the home page of
# https://lbem-ft.epfl.ch/ (the WASM app sits beside them at /ft/).
#
# The manual used to be packed into the app itself and served from /ft/. It now
# lives on its own path so it can be updated, indexed and linked independently
# of the WASM app — a manual fix no longer means re-deploying the app, and the
# app's cross-origin isolation (below) does not apply to the pages.
#
# This is NOT a full vhost — it's meant to be Include'd inside the :443 vhost
# of lbem-ft.epfl.ch (lbem-ft-vhost.conf), whose DocumentRoot is /srv/ft-manual.
#
# Install:
#     sudo cp ft-manual-apache.conf /etc/apache2/conf-available/ft-manual.conf
#     sudo apache2ctl configtest && sudo systemctl reload apache2
# doit says when the installed copy differs from the one it was deployed with.
# Do NOT a2enconf it: it belongs to that one vhost.

# The manual used to be served under /ft-manual/ (on lbem-status.epfl.ch), and
# the app's loading screen still links there (build_wasm.sh). Send those paths
# to the same page at the site root. The slash after "ft-manual" is required
# rather than optional so that a file whose name merely starts with "ft-manual"
# is not caught as well.
#
# It is a 301, since the move is permanent — which does mean browsers remember
# it, so clear the cache when testing changes to this line.
RedirectMatch permanent "^/ft-manual(?:/(.*))?$" "/$1"

<Directory /srv/ft-manual>
    Require all granted
    Options -Indexes
    AllowOverride None
    # Serve the site root as the manual's front page. index.html is listed as well
    # because the deployed tree ships one (it forwards to manual.html): with
    # Options -Indexes, a directory whose index file the server does not
    # recognise is answered with 403 Forbidden, and index.html is what makes the
    # bare directory URL work on a server where this snippet is not installed.
    DirectoryIndex manual.html index.html

    # Deliberately NO Cross-Origin-Opener-Policy / -Embedder-Policy here. Those
    # exist under /ft/ to unlock SharedArrayBuffer for the multithreaded WASM
    # build; the manual is plain self-contained HTML and require-corp would only
    # stand in the way of ever embedding anything cross-origin in a page.

    # The app's "Find in manual" search downloads these pages in the background
    # (QNetworkAccessManager). That is same-origin for the deployed app under
    # /ft/, but a WASM build served from anywhere else (localhost during
    # development) needs CORS consent — and, because the app runs cross-origin
    # isolated (COEP: require-corp), a resource policy as well. Both are
    # no-ops for ordinary readers of a public manual.
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Cross-Origin-Resource-Policy "cross-origin"
    </IfModule>
</Directory>

# Gzip the pages. Worth doing: the text compresses hard. The figures live in
# figures/*.png (pulled out of manual.html, which base64-embedded them once) and
# are already-compressed PNG, so they are not on the list.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html image/svg+xml
</IfModule>

# The pages are overwritten in place on each deploy (no content hash in the
# filename), so they must revalidate — otherwise a reader keeps last month's
# manual while the app has moved on. The figures are overwritten in place too,
# but change far more rarely than the text, and a page view pulls ~20 of them —
# a day of staleness is a fair price for sparing every visit those requests.
<IfModule mod_headers.c>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.png$">
        Header set Cache-Control "max-age=86400"
    </FilesMatch>
</IfModule>
