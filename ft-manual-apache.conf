# Apache config snippet for the ft manual pages, served at /ft-manual/.
#
# The manual used to be packed into the app itself and served from /ft/. It now
# lives on its own path so it can be updated, indexed and linked independently
# of the WASM app — a manual fix no longer means re-deploying the app, and the
# app's cross-origin isolation (below) does not apply to the pages.
#
# This is NOT a full vhost — it's meant to be Include'd inside the existing
# :443 SSL vhost on lbem-status.epfl.ch (the same one that Includes
# ft-wasm.conf). The site's DocumentRoot stays at /var/www/html.
#
# Install:
#     sudo cp ft-manual-apache.conf /etc/apache2/conf-available/ft-manual.conf
#     sudo a2enmod headers deflate          # already on if /ft is set up
# Then in /etc/apache2/sites-available/default-ssl.conf, inside the
# <VirtualHost _default_:443> block, add (next to the existing ft Include):
#     Include conf-available/ft-manual.conf
# Then: sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The order of the two Includes does not matter: `Alias /ft` only matches a URL
# whose next character is "/" or the end of the path, so /ft-manual/… is never
# swallowed by the app's alias.

Alias /ft-manual /srv/ft-manual

# Send both /ft-manual and /ft-manual/ straight to the manual's first page.
#
# This does the job that DirectoryIndex would normally do, and it is here because
# DirectoryIndex could not be relied on: the list in force for this directory is
# inherited from the surrounding vhost, which serves a PHP site and so looks for
# index.php. A directory with no index the server recognises, under
# "Options -Indexes", is answered 403 Forbidden — which is what /ft-manual/ did,
# while /ft-manual/manual.html was fine all along. Naming the page outright needs
# neither DirectoryIndex nor Options to cooperate: mod_alias redirects are matched
# in the translate phase, before mod_dir ever sees a directory, and they take
# precedence over Alias whatever the order here.
#
# It is a 301, since /ft-manual is a permanent address — which does mean browsers
# remember it, so clear the cache when testing changes to this line.
RedirectMatch permanent "^/ft-manual/?$" "/ft-manual/manual.html"

<Directory /srv/ft-manual>
    Require all granted
    Options -Indexes
    AllowOverride None
    # Serve /ft-manual/ as the manual's front page. index.html is listed as well
    # because the deployed tree ships one (it forwards to manual.html): with
    # Options -Indexes, a directory whose index file the server does not
    # recognise is answered with 403 Forbidden, and index.html is what makes the
    # bare directory URL work on a server where this snippet is not installed.
    DirectoryIndex manual.html index.html

    # Deliberately NO Cross-Origin-Opener-Policy / -Embedder-Policy here. Those
    # exist under /ft/ to unlock SharedArrayBuffer for the multithreaded WASM
    # build; the manual is plain self-contained HTML and require-corp would only
    # stand in the way of ever embedding anything cross-origin in a page.

    # The app's "Find in manual" search downloads these pages in the background
    # (QNetworkAccessManager). That is same-origin for the deployed app under
    # /ft/, but a WASM build served from anywhere else (localhost during
    # development) needs CORS consent — and, because the app runs cross-origin
    # isolated (COEP: require-corp), a resource policy as well. Both are
    # no-ops for ordinary readers of a public manual.
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Cross-Origin-Resource-Policy "cross-origin"
    </IfModule>
</Directory>

# Gzip the pages. Worth doing: the text compresses hard, though the base64
# figures embedded in manual.html are already-compressed PNG and will not.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html image/svg+xml
</IfModule>

# The pages are overwritten in place on each deploy (no content hash in the
# filename), so they must revalidate — otherwise a reader keeps last month's
# manual while the app has moved on.
<IfModule mod_headers.c>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>
