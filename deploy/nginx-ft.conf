# Nginx configuration for serving the Qt WebAssembly build of ft
#
# Each browser tab runs an independent instance — no per-user server resources.
# The server just serves static files.
#
# Place this in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Adjust server_name, ssl_certificate, and root path as needed.

server {
    listen 80;
    server_name ft.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ft.example.com;

    ssl_certificate     /etc/ssl/certs/ft.example.com.pem;
    ssl_certificate_key /etc/ssl/private/ft.example.com.key;

    # Root points to the WASM build output directory
    root /var/www/ft;
    index ft.html;

    # Required for SharedArrayBuffer (needed if pthreads are enabled)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # WASM files need correct MIME type
    types {
        application/wasm wasm;
    }

    # Cache static assets
    location ~* \.(wasm|js|html)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        # Re-add COOP/COEP headers (add_header in location blocks replaces parent)
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }

    # Enable gzip for WASM (significant size reduction)
    gzip on;
    gzip_types application/wasm application/javascript text/html;
    gzip_min_length 1024;
}
