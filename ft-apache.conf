# Apache config snippet for the ft WASM app, served at https://lbem-ft.epfl.ch/ft/.
# This is NOT a full vhost — it's meant to be Include'd inside the :443 vhost
# of lbem-ft.epfl.ch (lbem-ft-vhost.conf), whose DocumentRoot is the manual.
#
# Install:
#     sudo cp ft-apache.conf /etc/apache2/conf-available/ft-wasm.conf
#     sudo apache2ctl configtest && sudo systemctl reload apache2
# doit says when the installed copy differs from the one it was deployed with.
# Do NOT a2enconf it: it belongs to that one vhost.

Alias /ft /srv/ft

<Directory /srv/ft>
    Require all granted
    Options -Indexes
    AllowOverride None
    # Serve /ft/ directly as ft.html so the URL is just /ft/.
    DirectoryIndex ft.html

    # Cross-origin isolation — REQUIRED for the multithreaded WASM build.
    # Without these the browser does not expose SharedArrayBuffer, so pthreads
    # (and the parallel FFT) are unavailable. Scoped to this <Directory> so the
    # rest of the site (the PHP app) is unaffected — a site-wide COEP
    # require-corp would otherwise block its cross-origin resources.
    <IfModule mod_headers.c>
        Header set Cross-Origin-Opener-Policy "same-origin"
        Header set Cross-Origin-Embedder-Policy "require-corp"
    </IfModule>
</Directory>

# Correct MIME type for WebAssembly.
AddType application/wasm .wasm

# Gzip wasm/js/html/svg payloads.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/wasm application/javascript text/html image/svg+xml
</IfModule>

# ft.wasm / ft.js are overwritten in place on each deploy (no content hash
# in the filename), so they MUST revalidate. Otherwise Safari caches an old
# ft.js alongside a new ft.wasm and streaming compile fails with misleading
# "access control checks" errors.
<IfModule mod_headers.c>
    <FilesMatch "\.(wasm|js|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.svg$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
