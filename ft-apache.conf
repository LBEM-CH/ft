# Apache config snippet for the ft WASM app.
# This is NOT a full vhost — it's meant to be Include'd inside the existing
# :443 SSL vhost on lbem-status.epfl.ch. The site's DocumentRoot stays at
# /var/www/html (the existing PHP app); the WASM app is served under /ft/.
#
# Install:
#     sudo cp ft-apache.conf /etc/apache2/conf-available/ft-wasm.conf
#     sudo a2enmod headers deflate
# Then in /etc/apache2/sites-available/default-ssl.conf, inside the
# <VirtualHost _default_:443> block, add:
#     Include conf-available/ft-wasm.conf
# Make sure DocumentRoot in that vhost is /var/www/html (the original value).

Alias /ft /srv/ft

<Directory /srv/ft>
    Require all granted
    Options -Indexes
    AllowOverride None
    # Serve /ft/ directly as ft.html so the URL is just /ft/.
    DirectoryIndex ft.html
</Directory>

# Correct MIME type for WebAssembly.
AddType application/wasm .wasm

# Gzip wasm/js/html/svg payloads.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/wasm application/javascript text/html image/svg+xml
</IfModule>

# ft.wasm / ft.js are overwritten in place on each deploy (no content hash
# in the filename), so they MUST revalidate. Otherwise Safari caches an old
# ft.js alongside a new ft.wasm and streaming compile fails with misleading
# "access control checks" errors.
<IfModule mod_headers.c>
    <FilesMatch "\.(wasm|js|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.svg$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
