# Apache config snippet for the ft WASM app.
# This is NOT a full vhost — it's meant to be Include'd inside an existing
# <VirtualHost> on the target (lbem-status.epfl.ch's :443 SSL vhost).
#
# Install on the target:
#     sudo cp ft-apache.conf /etc/apache2/conf-available/ft-wasm.conf
#     sudo a2enmod headers deflate
#     sudo a2enconf ft-wasm        # makes the file globally available (but see below)
#
# Then in /etc/apache2/sites-available/default-ssl.conf, change:
#     DocumentRoot /var/www/html
# to:
#     DocumentRoot /srv/ft
# and inside the same <VirtualHost>, add:
#     Include conf-available/ft-wasm.conf
#
# Keep the WebDAV Alias/Directory blocks in default-ssl.conf untouched —
# /webdav will keep working because Alias takes precedence over DocumentRoot.

<Directory /srv/ft>
    Require all granted
    Options -Indexes
    AllowOverride None
</Directory>

# Correct MIME type for WebAssembly.
AddType application/wasm .wasm

# Gzip wasm/js/html/svg payloads.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/wasm application/javascript text/html image/svg+xml
</IfModule>

# Long cache for immutable build artifacts; no cache for the HTML entry point.
<IfModule mod_headers.c>
    <FilesMatch "\.(wasm|js|svg)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>
