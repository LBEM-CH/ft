# Apache vhost for https://lbem-ft.epfl.ch/ on lbem-app.epfl.ch: the ft manual
# at the site root and the ft WASM app at /ft/.
#
# What is served lives in the two snippets this vhost Includes,
# ft-manual-apache.conf and ft-apache.conf, which doit checks against the repo
# on every deploy. This file holds only what is particular to the host — the
# name, the certificate and the logs — so certbot can edit its certificate
# lines in the installed copy without the repo having to follow.
#
# One-time setup on lbem-app, from ~/ft-deploy (build_webserver.sh uploads this
# file and the snippets there):
#     sudo mkdir -p /srv/ft /srv/ft-manual
#     sudo chown $USER: /srv/ft /srv/ft-manual
#     sudo a2enmod ssl headers
#     sudo cp ft-apache.conf        /etc/apache2/conf-available/ft-wasm.conf
#     sudo cp ft-manual-apache.conf /etc/apache2/conf-available/ft-manual.conf
#     sudo cp lbem-ft-vhost.conf    /etc/apache2/sites-available/lbem-ft.conf
#     sudo a2ensite lbem-ft
#     sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The certificate below is Ubuntu's self-signed placeholder (package ssl-cert).
# Once the site is reachable from the internet,
#     sudo certbot --apache -d lbem-ft.epfl.ch
# replaces it in the installed copy with a Let's Encrypt one and renews it.

<VirtualHost *:80>
    ServerName lbem-ft.epfl.ch
    Redirect permanent / https://lbem-ft.epfl.ch/
</VirtualHost>

<VirtualHost *:443>
    ServerName lbem-ft.epfl.ch
    DocumentRoot /srv/ft-manual

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    Include conf-available/ft-manual.conf
    Include conf-available/ft-wasm.conf

    ErrorLog ${APACHE_LOG_DIR}/lbem-ft_error.log
    CustomLog ${APACHE_LOG_DIR}/lbem-ft_access.log combined
</VirtualHost>
